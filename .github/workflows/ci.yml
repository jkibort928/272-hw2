# Author: Sabari Iyyapan Duraipandian
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy values so src/main.py can call get_settings() at import time.
  # Unit tests never reach the network, and tests/integration self-skips
  # by checking these exact var names, so no real credentials are needed
  # here - see tests/integration/test_issues_flow.py.
  GITHUB_OWNER: ci-owner
  GITHUB_REPO: ci-repo
  WEBHOOK_SECRET: ci-secret
  PORT: "8000"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate OpenAPI spec
        run: python -m openapi_spec_validator openapi.yaml

      - name: Unit tests with coverage
        env:
          # Scoped to this step only - NOT job/workflow level - so it can
          # never be confused with the GITHUB_TOKEN Actions auto-injects,
          # and so tests/integration still sees it unset and self-skips.
          GITHUB_TOKEN: ci-dummy-token
        run: pytest tests/unit --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: false
          load: true
          tags: github-issues-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name gateway -p 8000:8000 \
            -e GITHUB_TOKEN=ci-dummy-token \
            -e GITHUB_OWNER=ci-owner \
            -e GITHUB_REPO=ci-repo \
            -e WEBHOOK_SECRET=ci-secret \
            github-issues-gateway:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/healthz; then echo " healthy"; exit 0; fi
            sleep 1
          done
          echo "service did not become healthy"; docker logs gateway; exit 1

      - name: Tear down
        if: always()
        run: docker rm -f gateway || true
