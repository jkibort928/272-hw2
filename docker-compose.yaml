# Author: Sabari Iyyapan Duraipandian
# Local stack: Caddy reverse proxy in front of the FastAPI gateway.
# The proxy is the only thing published to the host; the app itself is
# reachable only on the internal compose network.
#
# Usage:
#   cp .env.example .env   # (or edit .env.example values in place)
#   docker compose up --build
#   curl http://localhost:8080/healthz

services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env.example
    expose:
      - "8000"
    volumes:
      - events-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  events-data:
